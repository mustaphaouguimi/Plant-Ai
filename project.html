<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planit Ai</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <aside class="fixed top-0 left-0 h-screen w-64 bg-blue-600 flex flex-col text-white  border-blue-900">
        <div class="flex flex-col items-center p-6 border-gray-700">
            <img src="Gemini_Generated_Image_gjcmwcgjcmwcgjcm.jpg" alt="Plant ai"
                class="w-20 h-20 block gap-5 text-center object-contain">
            <h1 class="mt-16 text-xl p-4 font-bold text-blue-400">Plant Ai</h1>
        </div>
        <nav flex-1 p-4>
            <ul>
                <li><a href="index.html" class="flex items-center gap-3 p-3 rounded-lg bg-blue-600 hover:bg-blue-700"> <i
                            class="fa-solid fa-house"></i>Dashboard</a></li>
                <li><a href="new-project.html"
                        class="flex items-center gap-3 p-3 rounded-lg bg-blue-600 hover:bg-blue-700"> <i
                            class="fa solid fa-plus"></i>Nouveau projet</a></li>
                <li><button type="button" class="flex items-center gap-3 p-3 rounded-lg bg-blue-600 hover:bg-blue-700"
                        id="open" data-toggle="modal" data-target="#modal"><i class="fa-solid fa-gear"></i>
                        Paramètres</button></li>
            </ul>
        </nav>
    </aside>
    <main class="ml-64  min-h-screen">
        <div id="modal"
            class="hidden fixed bg-black/50 inset-0 z-50 flex items-center justify-center rounded-xl p-6 h-modal">
            <div class="bg-gray-50 shadow-md rounded-xl p-6 w-full  max-w-md">
                <form id="vform" data-parsley-validate class="flex flex-col gap-4">
                    <input type="password" id="apiKey" required minlength="8" data-parsley-minlength="8"
                        data-parsley-minlength-message="at lest 8 character"  placeholder="Enter API key"
                        class="border border-gray-300 rounded-lg outline-none h-10 px-3 focus:ring-2 focus:ring-blue-500">
                    <button type="submit" id="close" class="rounded-lg bg-blue-600 hover:bg-blue-700">send</button>
                </form>
            </div>

        </div>
        <h1 id="titre" class="text-center font-semibold"></h1>
        <div class="laoder hidden" id="loader">loading...</div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 p-6 items-start place-items-center" id="task-grid">
            <div class="bg-gray-100 rounded-xl p-4 shadow-sm">
                <div class="flex items-center gap-2 mb-4 pb-2 border-gray-300">
                    <span class="h-3 w-3 bg-red-500 rounded-full"></span>
                    <h2 class="font-bold text-lg text-gray-800">To Do</h2>

                </div>
                <div id="todo" class="flex flex-col gap-4"></div>

            </div>
            <div class="bg-gray-100 rounded-xl p-4 shadow-sm">
                <div class="flex items-center gap-2 mb-4 pb-2 border-gray-300">
                    <span class="h-3 w-3 bg-yellow-500 rounded-full"></span>
                    <h2 class="font-bold text-lg text-gray-800">In Progress</h2>
                </div>
                <div id="progress" class="flex flex-col gap-4"></div>

            </div>
            <div class="bg-gray-100 rounded-xl p-4 shadow-sm">
                <div class="flex items-center gap-2 mb-4 pb-2 border-gray-300">
                    <span class="h-3 w-3 bg-green-500 rounded-full"></span>
                    <h2 class="font-bold text-lg text-gray-800">Done</h2>
                </div>
                <div id="done" class="flex flex-col gap-4"></div>

            </div>
        </div>
        <dialog id="openmodal" class="fixed top-1/2 left-1/2 bg-gray-100 z-50  justify-center items-center rounded-xl p-6 h-modal">
            <p id="description"></p>
            <p id="userStories"></p>
            <button id="closemodal">close</button>
        </dialog>
    </main>
    <script type="module" src="app.js"></script>
       <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/parsleyjs@2.9.2/dist/parsley.min.js"></script>
</body>

</html>
