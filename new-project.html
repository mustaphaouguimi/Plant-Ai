<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlanIt AI</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">




</head>

<body>
    <aside class="fixed top-0 left-0 h-screen w-64 bg-blue-600 flex flex-col text-white  border-blue-900">
        <div class="flex flex-col items-center p-6 border-gray-700">
            <img src="Gemini_Generated_Image_gjcmwcgjcmwcgjcm.jpg" alt="Plant ai"
                class="w-20 h-20 block gap-5 text-center object-contain">
            <h1 class="mt-16 text-xl p-4 font-bold text-blue-400">Plant Ai</h1>
        </div>
        <nav flex-1 p-4>
            <ul>
                <li><a href="index.html" class="flex items-center gap-3 p-3 rounded bg-blue-600 hover:bg-blue-700"> <i
                            class="fa-solid fa-house"></i>Dashboard</a></li>
                <li><a href="new-project.html"
                        class="flex items-center gap-3 p-3 rounded bg-blue-600 hover:bg-blue-700"> <i
                            class="fa solid fa-plus"></i>Nouveau projet</a></li>
                <li><button type="button" class="flex items-center gap-3 p-3 rounded-lg bg-blue-600 hover:bg-blue-700"
                        id="open" data-toggle="modal" data-target="#modal"><i class="fa-solid fa-gear"></i>
                        Paramètres</button></li>

            </ul>
        </nav>
    </aside>
    <main class="ml-100 p-6 border-gray-700 min-h-screen">
        <div id="modal"
            class="hidden fixed bg-black/50 inset-0 z-50 flex items-center justify-center rounded-xl p-6 h-modal">
            <div class="bg-gray-50 shadow-md rounded-xl p-6 w-full  max-w-md">
                <form id="vform" data-parsley-validate class="flex flex-col gap-4">
                    <input type="password" required minlength="8" data-parsley-minlength="8"
                        data-parsley-minlength-message="at lest 8 character" value="send" placeholder="Enter API key"
                        class="border border-gray-300 rounded-lg outline-none h-10 px-3 focus:ring-2 focus:ring-blue-500">
                    <button type="submit" id="close" class="rounded-lg bg-blue-600 hover:bg-blue-700">send</button>
                </form>
            </div>

        </div>
        <div>
            <header class="flex justify-between">
                <form action="#">
                    <i class="fa-solid fa-search"></i>
                    <input type="text" placeholder="search project, task..." class="w-150 h-8 border rounded">
                </form>
                <button class="bg-blue-600 w-30 h-10 rounded text-white"> <i class="fa-solid fa-plus"></i>create
                    task</button>
            </header>
        </div>
        <div class="max-w-2xl mx-auto mt-10">
            <div class="mb-6">
                <h1 class="font-semibold text-2xl text-center">Create a new project</h1>
            </div>
            <div class="bg-gray-50 shadow-md rounded-xl p-6">
                <form action="#" data-parsley-validate class="flex flex-col gap-4">
                    <label for="project-name" class="block mb-2 font-medium">name of project</label>
                    <input type="text" name="project-name"
                        class="border border-gray-300 rounded-lg outline-none h-10 px-3 focus:ring-2 focus:ring-blue-500"
                        placeholder="Enter project name" id="project-name" required minlength="3"
                        data-parsley-required-message="Project name is required"
                        data-parsley-minlength-message="name must contain at lest 3 caracters">
                    <label for="description" data-parsley-required="true"
                        class="block  mb-2 font-medium">discription</label>
                    <textarea name="description" required minlength="10"
                        data-parsley-required-message="description of project is required"
                        data-parsley-minlength-message="at lest 10 character"
                        class="w-full border border-gray-300 rounded-lg h-10 px-3 outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="Discript your project" id="description"></textarea>
                    <label for="duration" data-parsley-minlength="1" class="mb-2 font-medium">duration in days</label>
                    <input type="number" required min="1" data-parsley-required-message="Duration is required"
                        placeholder="e.g. 7" data-parsley-type="number"
                        class="w-full border border-gray-300 rounded-lg h-10 px-3 outline-none focus:ring-2 focus:ring-blue-500">
                    <label for="Number-of-developers" class="block mb-2 font-medium">Number of developers</label>
                    <input type="number" required min="1" data-parsley-required-message="Enter number of devlopers"
                        class="w-full border border-gray-300 rounded-lg h-10 px-3 outline-none focus:ring-2 focus:ring-blue-500"
                        name="Number-of-developers" placeholder="e.g. 4">
                    <label for="technologies" class="mb-2 font-medium">technologies</label>
                    <input type="text" required data-parsley-required-message="Enter technologies you want to use"
                        class="w-full border border-gray-300 rounded-lg h-10 px-3 outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="e.g. html js react.js">

                    <label for="level" class="mb-2 font-medium">level</label>
                    <select name="level"
                        class="w-ful border border-gray-300 rounded-lg h-10 px-3 outline-none focus:ring-2 focus:ring-blue-500"
                        id="level" required>
                        <option value="High">High</option>
                        <option value="Medium">Medium</option>
                        <option value="Low">Low</option>
                    </select>
                    <input type="submit" value="create plan"
                        class="border rounded-lg bg-blue-600 hover:bg-blue-700 text-center mt-3 w-full h-10">
                </form>
            </div>
        </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/parsleyjs@2.9.2/dist/parsley.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
